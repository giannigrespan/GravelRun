<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Daily Gravel Adventure - Leaderboard</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 840px;
            background: #2d3748;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }
        .hud-box {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .hud-label {
            font-size: 10px;
            color: #a0aec0;
            text-transform: uppercase;
        }
        .hud-value {
            color: #38bdf8;
            font-size: 18px;
        }
        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            text-align: center;
            padding: 24px 20px;
            z-index: 20;
            overflow-y: auto;
        }
        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 4px;
            color: #f8fafc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .sub-title {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .date-badge {
            background: #3b82f6;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 12px;
            display: inline-block;
        }
        .player-input-group {
            margin-bottom: 12px;
            width: 100%;
            max-width: 280px;
        }
        .player-input-group label {
            display: block;
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
            text-transform: uppercase;
            font-weight: 600;
        }
        .player-input-group input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #1e293b;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            outline: none;
        }
        .player-input-group input:focus {
            border-color: #38bdf8;
        }
        .btn {
            background: #22c55e;
            color: #052e16;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
            transition: transform 0.1s, background 0.2s;
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        .btn:active {
            transform: scale(0.96);
        }
        /* Leaderboard UI */
        .leaderboard-box {
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            margin-top: 8px;
        }
        .leaderboard-title {
            font-size: 12px;
            font-weight: 700;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .leaderboard-list {
            list-style: none;
            max-height: 180px;
            overflow-y: auto;
        }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            font-size: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .leaderboard-item:last-child {
            border-bottom: none;
        }
        .leaderboard-item.highlight {
            background: rgba(56, 189, 248, 0.15);
            border-radius: 6px;
            font-weight: 700;
            color: #38bdf8;
        }
        .rank {
            width: 24px;
            font-weight: 800;
            color: #64748b;
        }
        .rank.top-1 { color: #f59e0b; }
        .rank.top-2 { color: #94a3b8; }
        .rank.top-3 { color: #b45309; }
        .player-name {
            flex: 1;
            text-align: left;
            margin-left: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .score-val {
            font-weight: 700;
            font-family: monospace;
        }
        .instructions {
            margin-top: 12px;
            font-size: 11px;
            color: #64748b;
            line-height: 1.4;
        }
        #touch-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            display: flex;
            z-index: 5;
        }
        .touch-zone {
            flex: 1;
            height: 100%;
        }
        .sponsor-banner {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #38bdf8;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
            pointer-events: none;
        }
        .sponsor-tag {
            background: #38bdf8;
            color: #0f172a;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 800;
            font-size: 9px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="ui-panel">
        <div class="hud-box">
            <div class="hud-label">Distanza</div>
            <div class="hud-value" id="dist-val">0.0 km</div>
        </div>
        <div class="hud-box">
            <div class="hud-label">Velocità</div>
            <div class="hud-value" id="speed-val">0 km/h</div>
        </div>
    </div>

    <div class="sponsor-banner" id="active-sponsor" style="display:none;">
        <span class="sponsor-tag">SPONSOR</span>
        <span id="sponsor-text">Settore Shimano - Cambio di Pace!</span>
    </div>

    <canvas id="canvas"></canvas>

    <div id="touch-controls">
        <div class="touch-zone" id="touch-left"></div>
        <div class="touch-zone" id="touch-right"></div>
    </div>

    <div id="overlay">
        <div class="date-badge" id="daily-date">Tappa del Giorno</div>
        <h1 id="overlay-title">Daily Gravel</h1>
        <p class="sub-title" id="overlay-subtitle">Schiva le buche e conquista la classifica di oggi.</p>

        <div class="player-input-group">
            <label for="nickname">Nome Ciclista</label>
            <input type="text" id="nickname" maxlength="12" placeholder="Es. GravelKing" value="Rider_1">
        </div>

        <button class="btn" id="start-btn">Sali in Sella</button>

        <div class="leaderboard-box">
            <div class="leaderboard-title">
                <span>Classifica di Oggi</span>
                <span id="lb-status" style="font-size:10px; color:#64748b;">Connessione...</span>
            </div>
            <ul class="leaderboard-list" id="leaderboard-list">
                <li class="leaderboard-item">Caricamento tempi...</li>
            </ul>
        </div>

        <div class="instructions">
            <strong>Controlli:</strong> Tastiera (Frecce / A-D) o Touch ai lati dello schermo.
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('game-container');

function resize() {
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
}
resize();
window.addEventListener('resize', resize);

// Seed e Data giornaliera
function getDailySeed() {
    const d = new Date();
    return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}

function getDailyDateKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

let seed = getDailySeed();
function random() {
    let x = Math.sin(seed++) * 10000;
    return x - Math.floor(x);
}

const today = new Date();
document.getElementById('daily-date').innerText = `Tappa del ${today.getDate()}/${today.getMonth()+1}/${today.getFullYear()}`;

// ==========================================
// ONLINE LEADERBOARD SERVICE (API Vercel + MongoDB, fallback locale)
// ==========================================
const LeaderboardService = {
    async getDailyScores() {
        const res = await fetch('/api/scores');
        if (!res.ok) throw new Error('API ' + res.status);
        return (await res.json()).scores;
    },

    async submitScore(playerName, distanceKm) {
        if (!playerName || distanceKm <= 0) return;
        const res = await fetch('/api/scores', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: playerName, dist: distanceKm })
        });
        if (!res.ok) throw new Error('API ' + res.status);
        return (await res.json()).scores;
    }
};

function setLeaderboardStatus(text, ok) {
    const el = document.getElementById('lb-status');
    el.innerText = text;
    el.style.color = ok ? '#22c55e' : '#f59e0b';
}

async function updateLeaderboardUI(lastSubmittedPlayer = null) {
    const listEl = document.getElementById('leaderboard-list');
    let scores;
    try {
        scores = await LeaderboardService.getDailyScores();
        setLeaderboardStatus('Online', true);
    } catch (e) {
        setLeaderboardStatus('Offline', false);
        listEl.innerHTML = '<li class="leaderboard-item">Classifica non disponibile</li>';
        return;
    }

    listEl.innerHTML = '';
    if (!scores.length) {
        listEl.innerHTML = '<li class="leaderboard-item">Nessun tempo oggi: sii il primo!</li>';
        return;
    }
    scores.forEach((s, index) => {
        const li = document.createElement('li');
        const isCurrent = lastSubmittedPlayer && s.name === lastSubmittedPlayer;
        li.className = `leaderboard-item ${isCurrent ? 'highlight' : ''}`;

        let rankClass = '';
        if (index === 0) rankClass = 'top-1';
        else if (index === 1) rankClass = 'top-2';
        else if (index === 2) rankClass = 'top-3';

        const rank = document.createElement('span');
        rank.className = `rank ${rankClass}`;
        rank.textContent = `#${index + 1}`;
        const name = document.createElement('span');
        name.className = 'player-name';
        name.textContent = s.name;
        const val = document.createElement('span');
        val.className = 'score-val';
        val.textContent = `${s.dist.toFixed(2)} km`;
        li.append(rank, name, val);
        listEl.appendChild(li);
    });
}

// Carica nickname salvato precedentemente
const savedNick = localStorage.getItem('gravel_player_nick');
if (savedNick) document.getElementById('nickname').value = savedNick;

updateLeaderboardUI();

// Sponsor
const SPONSORS = [
    { name: "SHIMANO", color: "#0066B2", text: "Settore Shimano - Cambio di Pace!" },
    { name: "CANYON", color: "#1A1A1A", text: "Tratto Speed Canyon Bikes" },
    { name: "Vittoria", color: "#E30613", text: "Zona Grip Vittoria Terreno Dry" },
    { name: "MAAP", color: "#FF6B00", text: "Style Zone MAAP Apparel" }
];

// Stato Gioco
let gameState = 'START';
let distance = 0;
let speed = 0;
const MAX_SPEED = 32;
let playerX = 0;
let targetPlayerX = 0;
let roadOffset = 0;

const player = { x: 0, y: 0, width: 24, height: 48 };
let obstacles = [];
let banners = [];
let particles = [];

// Controlli Input
const keys = { left: false, right: false };

window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
});

window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});

const touchLeft = document.getElementById('touch-left');
const touchRight = document.getElementById('touch-right');

touchLeft.addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
touchLeft.addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
touchRight.addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
touchRight.addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });

document.getElementById('start-btn').addEventListener('click', startGame);

function startGame() {
    const nickInput = document.getElementById('nickname').value.trim() || "Rider_1";
    localStorage.setItem('gravel_player_nick', nickInput);

    seed = getDailySeed();
    gameState = 'PLAYING';
    distance = 0;
    speed = 18;
    playerX = canvas.width / 2;
    targetPlayerX = playerX;
    obstacles = [];
    banners = [];
    particles = [];
    document.getElementById('overlay').style.display = 'none';
}

async function gameOver() {
    gameState = 'GAMEOVER';
    const finalDistKm = distance / 1000;
    const nickInput = document.getElementById('nickname').value.trim() || "Rider_1";

    // Invio punteggio online
    try {
        await LeaderboardService.submitScore(nickInput, finalDistKm);
    } catch (e) {
        console.error(e);
    }

    const overlay = document.getElementById('overlay');
    document.getElementById('overlay-title').innerText = 'Caduto!';
    document.getElementById('overlay-subtitle').innerHTML = `Risultato: <strong>${finalDistKm.toFixed(2)} km</strong> registrati in classifica!`;
    document.getElementById('start-btn').innerText = 'Riprova Tappa';

    updateLeaderboardUI(nickInput);
    overlay.style.display = 'flex';
    document.getElementById('active-sponsor').style.display = 'none';
}

function spawnWorldElements() {
    if (gameState !== 'PLAYING') return;

    if (Math.random() < 0.03) {
        const roadWidth = canvas.width * 0.6;
        const minX = (canvas.width - roadWidth) / 2 + 20;
        const maxX = (canvas.width + roadWidth) / 2 - 20;
        obstacles.push({
            x: minX + random() * (maxX - minX),
            y: -50,
            radius: 12 + random() * 10,
            type: random() > 0.3 ? 'hole' : 'rock'
        });
    }

    if (Math.random() < 0.008) {
        const sponsor = SPONSORS[Math.floor(random() * SPONSORS.length)];
        const side = random() > 0.5 ? 'left' : 'right';
        const roadWidth = canvas.width * 0.6;
        const x = side === 'left'
            ? (canvas.width - roadWidth) / 2 - 40
            : (canvas.width + roadWidth) / 2 + 10;

        banners.push({ x, y: -80, width: 30, height: 60, sponsor, side });
    }
}

function update() {
    if (gameState !== 'PLAYING') return;

    speed = Math.min(MAX_SPEED, speed + 0.005);
    distance += speed * 0.1;
    roadOffset += speed * 0.8;

    const moveSpeed = 6;
    if (keys.left) targetPlayerX -= moveSpeed;
    if (keys.right) targetPlayerX += moveSpeed;

    const roadWidth = canvas.width * 0.65;
    const minX = (canvas.width - roadWidth) / 2 + player.width;
    const maxX = (canvas.width + roadWidth) / 2 - player.width;
    targetPlayerX = Math.max(minX, Math.min(maxX, targetPlayerX));

    playerX += (targetPlayerX - playerX) * 0.2;
    player.x = playerX;
    player.y = canvas.height - 120;

    if (Math.random() < 0.6) {
        particles.push({
            x: player.x + (Math.random() - 0.5) * 6,
            y: player.y + 20,
            vx: (Math.random() - 0.5) * 1.5,
            vy: 2 + Math.random() * 2,
            size: 2 + Math.random() * 4,
            alpha: 0.6
        });
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.02;
        if (p.alpha <= 0) particles.splice(i, 1);
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += speed * 0.4;

        const dx = player.x - obs.x;
        const dy = player.y - obs.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < obs.radius + player.width / 2) {
            gameOver();
        }

        if (obs.y > canvas.height + 50) obstacles.splice(i, 1);
    }

    let currentSponsorText = null;
    for (let i = banners.length - 1; i >= 0; i--) {
        let b = banners[i];
        b.y += speed * 0.4;

        if (Math.abs(b.y - player.y) < 150) {
            currentSponsorText = b.sponsor.text;
        }

        if (b.y > canvas.height + 100) banners.splice(i, 1);
    }

    const sponsorHud = document.getElementById('active-sponsor');
    if (currentSponsorText) {
        document.getElementById('sponsor-text').innerText = currentSponsorText;
        sponsorHud.style.display = 'flex';
    } else {
        sponsorHud.style.display = 'none';
    }

    document.getElementById('dist-val').innerText = (distance / 1000).toFixed(2) + ' km';
    document.getElementById('speed-val').innerText = Math.round(speed) + ' km/h';

    spawnWorldElements();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#3a4a28';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const roadWidth = canvas.width * 0.65;
    const roadLeft = (canvas.width - roadWidth) / 2;

    ctx.fillStyle = '#8c7355';
    ctx.fillRect(roadLeft, 0, roadWidth, canvas.height);

    ctx.strokeStyle = '#6e5a42';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(roadLeft, 0);
    ctx.lineTo(roadLeft, canvas.height);
    ctx.moveTo(roadLeft + roadWidth, 0);
    ctx.lineTo(roadLeft + roadWidth, canvas.height);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.lineWidth = 3;
    ctx.setLineDash([20, 20]);
    ctx.lineDashOffset = -roadOffset;
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 0);
    ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.stroke();
    ctx.setLineDash([]);

    banners.forEach(b => {
        ctx.fillStyle = '#475569';
        ctx.fillRect(b.x, b.y, b.width, b.height);

        ctx.fillStyle = b.sponsor.color;
        ctx.fillRect(b.x - 2, b.y + 5, b.width + 4, b.height - 10);

        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 9px sans-serif';
        ctx.translate(b.x + b.width / 2, b.y + b.height / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.textAlign = 'center';
        ctx.fillText(b.sponsor.name, 0, 3);
        ctx.restore();
    });

    particles.forEach(p => {
        ctx.fillStyle = `rgba(210, 180, 140, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });

    obstacles.forEach(obs => {
        if (obs.type === 'hole') {
            ctx.fillStyle = '#2a1a08';
            ctx.beginPath();
            ctx.ellipse(obs.x, obs.y, obs.radius, obs.radius * 0.6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#523a1c';
            ctx.lineWidth = 2;
            ctx.stroke();
        } else {
            ctx.fillStyle = '#64748b';
            ctx.beginPath();
            ctx.arc(obs.x, obs.y, obs.radius * 0.7, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
        ctx.save();
        ctx.translate(player.x, player.y);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        ctx.beginPath();
        ctx.ellipse(5, 5, 10, 22, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#1e293b';
        ctx.fillRect(-3, 8, 6, 16);

        ctx.strokeStyle = '#e11d48';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, 10);
        ctx.lineTo(0, -10);
        ctx.stroke();

        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-12, -12);
        ctx.lineTo(12, -12);
        ctx.lineTo(14, -6);
        ctx.moveTo(-12, -12);
        ctx.lineTo(-14, -6);
        ctx.stroke();

        ctx.fillStyle = '#1e293b';
        ctx.fillRect(-3, -22, 6, 16);

        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(0, 0, 9, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.arc(0, -2, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
